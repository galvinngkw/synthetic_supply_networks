[project]
name = "synthetic-supply-networks"
version = "0.1.0"
description = "PyTorch-based generator for synthetic firm-level supply networks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.7",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "igraph>=0.10",
    "tqdm>=4.66",
    "optuna>=4.0",
    "scikit-learn>=1.3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.28",
    "jupyterlab>=4.0",
    "notebook>=7.0",
    "ipywidgets>=8.0",
]
paper = [
    "seaborn>=0.12",
    "SciencePlots>=2.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["network_generator", "paper"]

[tool.hatch.build.targets.sdist]
include = [
    "/network_generator",
    "/paper",
    "/conf",
    "/README.md",
    "/pyproject.toml",
]
